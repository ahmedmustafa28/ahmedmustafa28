<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24" stop-opacity=".22"/><stop offset=".6" stop-color="#0D0A22"/></linearGradient>
 <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FBBF24" fill-opacity=".18"/></pattern>
</defs>
<style>
 .p{font:800 14px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:3px}
 .n{font:900 30px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F8FAFC;letter-spacing:.5px}
 .q{font:400 18px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94A3B8}
 .c{font:700 16px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
 .run{animation:run 3.5s linear infinite} @keyframes run{to{stroke-dashoffset:-1520}}
 .ic{animation:bob 3s ease-in-out infinite} @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
 .bl{animation:bl 1.2s steps(1) infinite} @keyframes bl{50%{opacity:0}}
</style>
<rect x="2" y="2" width="576" height="196" rx="18" fill="#0D0A22"/>
<rect x="2" y="2" width="576" height="196" rx="18" fill="url(#bg)"/>
<rect x="2" y="2" width="576" height="196" rx="18" fill="url(#dots)"/>
<rect x="2" y="2" width="576" height="196" rx="18" fill="none" stroke="#FBBF24" stroke-opacity=".5" stroke-width="2"/>
<rect x="2" y="2" width="576" height="196" rx="18" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="160 1360" class="run"/>
<g transform="translate(100,100)"><circle r="56" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".7" stroke-width="2"/><g class="ic" style="color:#FBBF24"><path d="M-30 -6 L0 -20 L30 -6 L0 8z M-16 0 v14 q16 12 32 0 v-14 M30 -6 v18" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></g></g>
<text x="190" y="58" class="p" fill="#FBBF24">▶ P4 <tspan class="bl">█</tspan></text>
<text x="190" y="100" class="n">THE STUDENT</text>
<text x="190" y="130" class="q">Learning ML too?</text>
<rect x="190" y="146" width="208.5" height="34" rx="17" fill="#FBBF24" fill-opacity=".16" stroke="#FBBF24" stroke-opacity=".8"/>
<text x="205" y="169" class="c" fill="#FBBF24">100 Days of ML  →</text>
</svg>
