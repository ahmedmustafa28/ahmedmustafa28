<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A855F7" stop-opacity=".22"/><stop offset=".6" stop-color="#0D0A22"/></linearGradient>
 <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#A855F7" fill-opacity=".18"/></pattern>
</defs>
<style>
 .p{font:800 14px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:3px}
 .n{font:900 30px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#F8FAFC;letter-spacing:.5px}
 .q{font:400 18px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94A3B8}
 .c{font:700 16px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
 .run{animation:run 3.5s linear infinite} @keyframes run{to{stroke-dashoffset:-1520}}
 .ic{animation:bob 3s ease-in-out infinite} @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
 .bl{animation:bl 1.2s steps(1) infinite} @keyframes bl{50%{opacity:0}}
</style>
<rect x="2" y="2" width="576" height="196" rx="18" fill="#0D0A22"/>
<rect x="2" y="2" width="576" height="196" rx="18" fill="url(#bg)"/>
<rect x="2" y="2" width="576" height="196" rx="18" fill="url(#dots)"/>
<rect x="2" y="2" width="576" height="196" rx="18" fill="none" stroke="#A855F7" stroke-opacity=".5" stroke-width="2"/>
<rect x="2" y="2" width="576" height="196" rx="18" fill="none" stroke="#A855F7" stroke-width="3" stroke-dasharray="160 1360" class="run"/>
<g transform="translate(100,100)"><circle r="56" fill="#A855F7" fill-opacity=".12" stroke="#A855F7" stroke-opacity=".7" stroke-width="2"/><g class="ic" style="color:#A855F7"><circle cx="0" cy="-12" r="14" fill="none" stroke="currentColor" stroke-width="4"/><path d="M-26 26 q26 -34 52 0" fill="none" stroke="currentColor" stroke-width="4"/></g></g>
<text x="190" y="58" class="p" fill="#A855F7">▶ P1 <tspan class="bl">█</tspan></text>
<text x="190" y="100" class="n">THE RECRUITER</text>
<text x="190" y="130" class="q">Looking for talent?</text>
<rect x="190" y="146" width="198.0" height="34" rx="17" fill="#A855F7" fill-opacity=".16" stroke="#A855F7" stroke-opacity=".8"/>
<text x="205" y="169" class="c" fill="#A855F7">View LinkedIn  →</text>
</svg>
