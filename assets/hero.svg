<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07071A"/><stop offset=".55" stop-color="#120A2E"/><stop offset="1" stop-color="#05121F"/></linearGradient>
 <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#22D3EE"/><stop offset=".35" stop-color="#A855F7"/><stop offset=".7" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
 </linearGradient>
 <linearGradient id="nameBase" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
  <stop offset="0" stop-color="#22D3EE"/><stop offset=".33" stop-color="#A855F7"/><stop offset=".66" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1 0" dur="5s" repeatCount="indefinite"/>
 </linearGradient>
 <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
 <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <radialGradient id="fade" cx=".5" cy=".5" r=".7"><stop offset=".4" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
 <mask id="gm"><rect width="1200" height="440" fill="url(#fade)"/></mask>
 <clipPath id="clip"><rect width="1200" height="440" rx="24"/></clipPath>
</defs>
<style>
 .grid line{stroke:#A855F7;stroke-opacity:.08;stroke-width:1}
 .orb{animation:float 12s ease-in-out infinite}
 .orb2{animation:float 15s ease-in-out infinite reverse}
 @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,40px)}}
 .e{stroke:#A855F7;stroke-opacity:.18;stroke-width:1.2}
 .p{stroke:#22D3EE;stroke-width:2;stroke-dasharray:10 160;animation:flow 2.4s linear infinite}
 @keyframes flow{from{stroke-dashoffset:170}to{stroke-dashoffset:0}}
 .n{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes pulse{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
 .chip{font:700 22px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#A855F7;opacity:.25;animation:bob 6s ease-in-out infinite}
 @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
 .hi{font:600 22px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#22D3EE;letter-spacing:2px}
 .nm{font:900 86px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;letter-spacing:-1px}
 .sub{font:600 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#C9D1D9}
 .role{font:500 24px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#E9D5FF;opacity:0;animation:roles 12s linear infinite}
 @keyframes roles{0%{opacity:0;transform:translateY(12px)}3%,22.0%{opacity:1;transform:translateY(0)}25.0%,100%{opacity:0;transform:translateY(-12px)}}
 .cur{fill:#22D3EE;animation:blink 1s steps(1) infinite}
 @keyframes blink{50%{opacity:0}}
 .pill{font:700 14px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;letter-spacing:1.5px}
 .live{animation:live 1.6s ease-in-out infinite}
 @keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
 .fadein{animation:fi 1.2s ease-out both}
 @keyframes fi{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
</style>
